# SansPost — prod-like: reverse proxy (TLS) → SansPost → PostgreSQL. Pojedyncza instancja aplikacji.
#   docker compose build && docker compose up -d
# Sekrety: pliki w ${SECRETS_DIR:-./secrets} (poza repozytorium) — patrz DEPLOYMENT.md.
name: sanspost

# Rotacja logów Dockera (json-file): najwyżej 5 × 10 MB na kontener — logi nie zapełnią dysku małego serwera.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sanspost}
      POSTGRES_USER: ${POSTGRES_USER:-sanspost}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend
    # Brak mapowania portu: baza dostępna tylko w sieci Docker.

  sanspost:
    build:
      context: .
      dockerfile: Dockerfile
    image: sanspost:${SANSPOST_TAG:-local}
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Bez hasła — hasło z pliku sekretu (Database:Password).
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-sanspost};Username=${POSTGRES_USER:-sanspost}"
      Database__MaxPoolSize: ${SANSPOST_DB_MAX_POOL_SIZE:-30}
      Database__MigrateOnStartup: "true"
      # Tylko proxy z tej sieci (stały adres) może ustawiać X-Forwarded-For/Proto.
      ForwardedHeaders__KnownProxies__0: 172.30.57.10
      HttpsRedirection__HttpsPort: ${HTTPS_PORT:-443}
      PublicDemo__RegistrationEnabled: ${SANSPOST_REGISTRATION_ENABLED:-true}
      PublicDemo__MaxPublicAccounts: ${SANSPOST_MAX_PUBLIC_ACCOUNTS:-100}
      PublicDemo__SeedContent: ${SANSPOST_SEED_CONTENT:-false}
      BootstrapAdmin__Enabled: "false"
    secrets:
      - source: postgres_password
        target: Database__Password
      - source: jwt_key
        target: Jwt__Key
    volumes:
      - dpkeys:/app/keys
    expose:
      - "8080"
    stop_grace_period: 20s
    mem_limit: ${SANSPOST_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD", "dotnet", "SansPost.dll", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - backend

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      sanspost:
        condition: service_healthy
    environment:
      SANSPOST_SITE_ADDRESS: ${SANSPOST_SITE_ADDRESS:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      backend:
        ipv4_address: 172.30.57.10

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.57.0/24

volumes:
  pgdata:
  dpkeys:
  caddy_data:
  caddy_config:

secrets:
  postgres_password:
    file: ${SECRETS_DIR:-./secrets}/postgres_password
  jwt_key:
    file: ${SECRETS_DIR:-./secrets}/jwt_key
